# Echo Dot 2nd gen 2016 (biscuit), Fire OS 6574.1 (NS65741) - the same build generation as donut.  Shell syntax, no
# commands: sourced by the PC scripts (scripts/lib/device.sh) and, shipped next to them, by the Echo-side scripts.
# Values below the identity block are donut's, from the same OS generation; each needs a check on the running Echo
# before first install (device facts in README.md, porting checklist in devices/README.md).

# --- identity: what the connected Echo must report before anything is written to it
MODEL_NAME="Echo Dot 2nd gen (2016)"
MODEL_NUMBER=RS03QR
PRODUCT=biscuit_puffin                   # OTA metadata pre-device=biscuit_puffin; getprop not yet checked
FIRMWARE_ID=NS65741                      # same build id as donut's 6574.1
FIRMWARE_FILE=update-kindle-biscuit_puffin-NS65741_user_8146_0013222531716.bin
FIRMWARE_SHA256=90832e86498c5e803974c30359aea71c1129757be0ddc59d831a94b27f81487f
DEFAULT_NAME="Echo Dot"
DEFAULT_ARGS=""                          # hassmic arguments written to hassmic.conf at install (ARGS)
# stock files that must be byte-identical to firmware/$DEVICE/rootfs/system (scripts/probe.sh)
PROBE_FILES="lib/libmixerAPI.so lib/libpryon.so lib/libasp.so bin/mixer bin/PuffinApp"

# --- installation: amonet-biscuit v2.0.0 leaves a Fire OS 6 device with TWRP, boot-root.zip root adb;
# the system install then follows the donut flow.  Verify against scripts/install-system.sh expectations on
# the running device (A/B slots, lptools, policy location) before using INSTALL=twrp-ab.
INSTALL=twrp-ab
SEPOLICY_TOOL=firmware/biscuit/boot-root/patch/magiskpolicy32  # generic ARM tool; extracted in setup step "build"

# --- the daemon's user: donut's values for the same OS generation; verify with the puffin service's rc on the Echo
DAEMON_USER=puffin
DAEMON_GROUPS=aipc,audio,system,inet,shell,dbus,ace_group,ace_kvstore,input,net_bt_stack

# --- stock services: all of donut's exist in biscuit's init files (checked in the firmware); verify users/behaviour
ALEXA_PROP=com.amazon.puffin.PUFFIN_START
ALEXA_SERVICES="puffin puffinmrmd dacd smarthomed"
UPDATE_SERVICES="otad ace_otad"
UPDATE_UID=ace_otad
UPDATE_ONDEMAND=update_engine
CLOUD_SERVICES="assetmgrd gadgetsd logmgr ace_metricd minerva_service usagestat_protod aceusagestatd trackerd provisionerd adepd sntpd UdssCampSvc fmonitor ace_messaging ahe shs"
BT_SERVICE=btmanagerd
UX_SERVICE=uxeventd
SETUP_SERVICES="oobed_on_boot oobed_on_press oobed_on_no_nw"
WIFI_SERVICE=wifisvc
WLAN=wlan0
WPA_SOCKETS=/data/misc/wifi/sockets
